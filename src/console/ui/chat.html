<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Agent 会话 · wechat-flow console</title>
<link rel="stylesheet" href="/ds.css">
<script src="/ds.js" defer></script>
<script src="/app.js" defer></script>
<script src="/chat.js" defer></script>
</head>
<body data-page="chat">
<header>
  <span class="brand">wechat-flow console</span>
  <a href="/app">账号</a>
  <a href="/workbench">内容工作台</a>
  <a id="nav-admin" href="/admin" hidden>运维</a>
  <span class="ds-spacer"></span>
  <span id="who" class="ds-muted"></span>
  <button id="logout" class="ds-btn ds-btn--ghost ds-btn--sm">退出</button>
</header>
<main class="ds-chat">
  <aside class="ds-card ds-chat__side">
    <h2 class="ds-card__title">会话</h2>
    <div class="ds-row ds-chat__picker">
      <select class="ds-select ds-grow" id="account"></select>
      <button id="reload" class="ds-btn ds-btn--ghost" type="button">刷新</button>
    </div>
    <button id="new-chat" class="ds-btn ds-btn--primary ds-chat__new" type="button">+ 新建会话</button>
    <ul id="chat-list" class="ds-chat-list"></ul>
    <div class="ds-tip ds-chat__tip">
      只读工具：read / grep / find / ls；任何写操作都会弹卡等你确认。
    </div>
  </aside>

  <section class="ds-chat__pane">
    <div class="ds-card ds-chat__bar">
      <strong id="chat-title" class="ds-chat__title">未选择会话</strong>
      <span id="chat-status" class="ds-badge">—</span>
      <span id="chat-busy" class="ds-badge ds-badge--warn" hidden>运行中</span>
      <span id="chat-model" class="ds-muted ds-mono"></span>
      <span class="ds-spacer"></span>
      <button id="model" class="ds-btn ds-btn--ghost ds-btn--sm" type="button">模型</button>
      <button id="fork" class="ds-btn ds-btn--ghost ds-btn--sm" type="button">分叉</button>
      <button id="clone" class="ds-btn ds-btn--ghost ds-btn--sm" type="button">克隆</button>
      <button id="abort" class="ds-btn ds-btn--ghost ds-btn--sm" type="button" hidden>中止</button>
      <button id="delete-chat" class="ds-btn ds-btn--danger-quiet ds-btn--sm" type="button">删除</button>
    </div>

    <div id="banner" class="ds-tip ds-tip--danger ds-banner" role="alert" hidden>
      <span id="banner-msg"></span>
      <button id="banner-close" class="ds-btn ds-btn--quiet ds-btn--sm" type="button">关闭</button>
    </div>

    <div id="messages" class="ds-messages"></div>

    <div id="tools" class="ds-tools" hidden></div>

    <div class="ds-card ds-composer">
      <textarea class="ds-textarea" id="composer-input" rows="3" placeholder="输入消息。Enter 发送，Shift+Enter 换行。"></textarea>
      <div class="ds-row">
        <button id="send" class="ds-btn ds-btn--primary" type="button">发送</button>
        <button id="steer" class="ds-btn ds-btn--ghost" type="button" title="在当前回合中插入引导">引导</button>
        <button id="followup" class="ds-btn ds-btn--ghost" type="button" title="排到当前回合之后">追问</button>
        <span class="ds-spacer"></span>
        <span id="hint" class="ds-muted"></span>
      </div>
    </div>
    <div id="msg" class="ds-flash" role="status" hidden></div>
  </section>
</main>
</body>
</html>
