<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>账号 · wechat-flow console</title>
<link rel="stylesheet" href="/ds.css">
<link rel="stylesheet" href="/app.css">
<script src="/ds.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body data-page="index">
<header>
  <span class="brand">wechat-flow console</span>
  <span id="who" class="muted"></span>
  <span class="ds-spacer"></span>
  <a id="nav-workbench" href="/workbench">内容工作台</a>
  <a id="nav-chat" href="/chat">Agent 会话</a>
  <a id="nav-admin" href="/admin" hidden>运维</a>
  <a id="nav-settings" href="/settings">全局设置</a>
  <button id="logout" class="ghost">退出</button>
</header>
<main>
  <section class="ds-card">
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">公众号账号</h2>
        <p class="ds-card__desc">登录态来自浏览器 cookie 与探测状态；剩余时长 &lt;36h 提示续期、&lt;12h 需要重新扫码。</p>
      </div>
      <div class="ds-card__actions">
        <button id="refresh-accounts" class="ds-btn ds-btn--ghost ds-btn--sm" type="button">刷新</button>
      </div>
    </div>
    <div class="ds-table-wrap">
      <table class="ds-table">
        <thead>
          <tr>
            <th>alias</th><th>显示名</th><th class="is-num">CDP</th><th>发布方式</th>
            <th>启用</th><th>登录态</th><th>覆盖项</th><th></th>
          </tr>
        </thead>
        <tbody id="accounts"></tbody>
      </table>
    </div>
    <div id="empty" class="ds-empty" hidden>
      <div>还没有任何公众号账号</div>
      <div class="ds-muted">管理员可在下方「新建账号」里添加，或先用 <span class="ds-mono">--import-config</span> 导入现有配置。</div>
    </div>
  </section>

  <section class="ds-card" id="create-card" hidden>
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">新建账号</h2>
        <p class="ds-card__desc">alias 同时是数据目录名，创建后不可修改。</p>
      </div>
    </div>
    <div class="ds-grid ds-grid--3">
      <div class="ds-field">
        <label class="ds-field__label" for="new-alias">alias</label>
        <input class="ds-input" id="new-alias" placeholder="second" autocomplete="off">
        <span class="ds-field__hint">2–32 位字母、数字、_ 或 -</span>
      </div>
      <div class="ds-field">
        <label class="ds-field__label" for="new-name">显示名（可选）</label>
        <input class="ds-input" id="new-name" placeholder="第二个公众号" autocomplete="off">
      </div>
      <div class="ds-field">
        <label class="ds-field__label" for="new-port">CDP 端口（可选）</label>
        <input class="ds-input" id="new-port" type="number" placeholder="9223">
      </div>
    </div>
    <div class="ds-row" id="create-actions">
      <button id="create" class="ds-btn ds-btn--primary" type="button">创建</button>
    </div>
  </section>

  <section class="ds-card" id="password-card">
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">修改密码</h2>
        <p class="ds-card__desc">修改后其他会话立即失效（需要重新登录）。</p>
      </div>
    </div>
    <div class="ds-grid ds-grid--2">
      <div class="ds-field">
        <label class="ds-field__label" for="cur-pw">当前密码</label>
        <input class="ds-input" id="cur-pw" type="password" autocomplete="current-password">
      </div>
      <div class="ds-field">
        <label class="ds-field__label" for="new-pw">新密码</label>
        <input class="ds-input" id="new-pw" type="password" autocomplete="new-password">
        <span class="ds-field__hint">至少 8 位</span>
      </div>
    </div>
    <div class="ds-row" id="pw-actions">
      <button id="change-pw" class="ds-btn" type="button">更新密码</button>
    </div>
  </section>
  <div id="msg" class="ds-flash" role="status" hidden></div>
</main>
</body>
</html>
