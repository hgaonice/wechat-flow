<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账号 · wechat-flow console</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body data-page="index">
<header>
  <span class="brand">wechat-flow console</span>
  <span id="who" class="muted"></span>
  <span class="spacer"></span>
  <a id="nav-workbench" href="/workbench">内容工作台</a>
  <a id="nav-chat" href="/chat">Agent 会话</a>
  <a id="nav-admin" href="/admin" hidden>运维</a>
  <a id="nav-settings" href="/settings">全局设置</a>
  <button id="logout" class="ghost">退出</button>
</header>
<main>
  <div class="card">
    <h2>公众号账号</h2>
    <table>
      <thead>
        <tr><th>alias</th><th>显示名</th><th>CDP</th><th>发布方式</th><th>启用</th><th>覆盖项</th><th></th></tr>
      </thead>
      <tbody id="accounts"></tbody>
    </table>
    <div id="empty" class="muted" hidden>暂无账号。管理员可在下方创建。</div>
  </div>

  <div class="card" id="create-card" hidden>
    <h2>新建账号</h2>
    <label for="new-alias">alias（数据目录名，2–32 位字母/数字/_/-）</label>
    <input id="new-alias" placeholder="second">
    <label for="new-name">显示名（可选）</label>
    <input id="new-name" placeholder="第二个公众号">
    <label for="new-port">CDP 端口（可选）</label>
    <input id="new-port" type="number" placeholder="9223">
    <div class="row mt">
      <button id="create" class="primary">创建</button>
    </div>
  </div>

  <div class="card" id="password-card">
    <h2>修改密码</h2>
    <label for="cur-pw">当前密码</label>
    <input id="cur-pw" type="password" autocomplete="current-password">
    <label for="new-pw">新密码（至少 8 位）</label>
    <input id="new-pw" type="password" autocomplete="new-password">
    <div class="row mt">
      <button id="change-pw">更新密码</button>
    </div>
  </div>
  <div id="msg" class="msg"></div>
</main>
</body>
</html>
