<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>登录 · wechat-flow console</title>
<link rel="stylesheet" href="/ds.css">
<script src="/ds.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body data-page="login">
<div class="ds-login">
  <div class="ds-login__brand">
    <span class="ds-sidebar__brand-mark"></span>
    <span>wechat-flow 控制台</span>
  </div>
  <form class="ds-card ds-login__card" id="login-form" autocomplete="on">
    <h2 class="ds-card__title ds-login__title">登录</h2>
    <p class="ds-card__desc">使用管理员或负责人账号登录。连续失败会触发限流。</p>
    <div class="ds-field">
      <label class="ds-field__label" for="username">用户名</label>
      <input class="ds-input" id="username" name="username" autocomplete="username" required>
    </div>
    <div class="ds-field">
      <label class="ds-field__label" for="password">密码</label>
      <input class="ds-input" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="ds-btn ds-btn--primary ds-login__submit" type="submit">登录</button>
    <div id="msg" class="ds-flash" role="status" hidden></div>
  </form>
  <p class="ds-login__foot">本控制台默认仅监听 127.0.0.1；对外访问请走隧道并开启鉴权。</p>
</div>
</body>
</html>
