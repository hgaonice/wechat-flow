<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>全局设置 · wechat-flow console</title>
<link rel="stylesheet" href="/ds.css">
<link rel="stylesheet" href="/app.css">
<script src="/ds.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body data-page="settings">
<header>
  <span class="brand">全局设置</span>
  <span class="ds-spacer"></span>
  <span id="who" class="muted"></span>
</header>
<main>
  <section class="ds-card">
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">global</h2>
        <p class="ds-card__desc">config.json 顶层（除 accounts 之外）。保存后立即写回 config.json；账号覆盖项在账号详情页维护。</p>
      </div>
    </div>
    <div class="ds-field">
      <label class="ds-field__label" for="global-json">JSON</label>
      <textarea class="ds-textarea" id="global-json" spellcheck="false"></textarea>
      <span class="ds-field__hint">非法 JSON 或数组不会被提交。</span>
    </div>
    <div class="ds-row">
      <button id="save" class="ds-btn ds-btn--primary" type="button">保存</button>
      <button id="reload" class="ds-btn ds-btn--ghost" type="button">放弃修改</button>
    </div>
    <div id="msg" class="ds-flash" role="status" hidden></div>
  </section>

  <section class="ds-card">
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">用户与授权</h2>
        <p class="ds-card__desc">管理员见全部账号；负责人只能访问被授权的账号。</p>
      </div>
    </div>
    <div class="ds-table-wrap">
      <table class="ds-table">
        <thead><tr><th class="is-num">id</th><th>用户名</th><th>角色</th><th>状态</th><th>授权账号</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </section>

  <section class="ds-card">
    <div class="ds-card__head">
      <div>
        <h2 class="ds-card__title">审计日志</h2>
        <p class="ds-card__desc">最近 100 条，含失败记录（失败必须显形）。</p>
      </div>
    </div>
    <div class="ds-table-wrap">
      <table class="ds-table ds-table--compact">
        <thead><tr><th>时间</th><th>动作</th><th>目标</th><th>结果</th><th>IP</th></tr></thead>
        <tbody id="audit"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
